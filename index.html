<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadenas · Generación de Adoradores</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d2b53">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cadenas GDA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="tt">
      <p class="kicker">Generación de Adoradores</p>
      <h1>Cadenas de alabanza</h1>
    </div>
    <div class="hbtns">
      <button id="btnNuevaTop" class="add-btn">+ Canción</button>
      <button id="btnVivo" class="vivo-btn">En vivo</button>
    </div>
  </header>

  <main>
    <section id="biblioteca" class="panel activo">
      <h2>Biblioteca</h2>
      <div class="chips" id="chips"></div>
      <input id="buscar" type="search" placeholder="Buscar canción o letra">
      <div id="lista" class="lista"></div>
    </section>

    <section id="cadena" class="panel">
      <h2>Mi cadena <span id="cuenta"></span></h2>
      <input id="nombreCadena" class="nombre" maxlength="60" placeholder="Nombre de la cadena (ej. Culto general)">

      <div class="herram">
        <span>Agregar:</span>
        <button data-nuevo="e:Júbilo">Júbilo</button>
        <button data-nuevo="e:Alabanzas">Alabanzas</button>
        <button data-nuevo="e:Coritos">Coritos</button>
        <button data-nuevo="e:Adoración">Adoración</button>
        <button data-nuevo="e:Himnos">Himnos</button>
        <button data-nuevo="e:Ofrenda">Ofrenda</button>
        <button data-nuevo="i:">Intro</button>
        <button data-nuevo="p:">Puente</button>
        <button data-nuevo="s:">Solo</button>
        <select id="selRitmo" aria-label="Ritmo">
          <option>Marcha</option><option>Disco</option><option>Rock</option><option>Balada</option>
        </select>
        <button id="btnRitmo">Cambio de ritmo</button>
      </div>

      <div id="zona" class="zona"></div>
      <div class="acciones">
        <button id="btnCopiar">Copiar</button>
        <button id="btnTxt">Descargar TXT</button>
        <button id="btnPdf">PDF / Compartir</button>
        <button id="btnImprimir">Imprimir</button>
        <button id="btnLimpiar" class="suave">Vaciar</button>
      </div>
    </section>
  </main>

  <nav class="barra">
    <button data-ver="biblioteca" class="activo">Biblioteca</button>
    <button data-ver="cadena">Mi cadena <b id="cuenta2"></b></button>
  </nav>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlgTitulo">Agregar canción</h2>
      <label>Título <input name="titulo" required maxlength="80"></label>
      <label>Sección
        <select name="seccion" required>
          <option>Júbilo</option>
          <option>Alabanzas</option>
          <option>Coritos</option>
          <option>Adoración</option>
          <option>Himnos</option>
        </select>
      </label>
      <label>Letra
        <textarea name="letra" rows="9" required placeholder="CORO: /x2/&#10;...&#10;&#10;ESTROFA 1:&#10;..."></textarea>
      </label>
      <label id="lblAutor">Tu nombre <input name="autor" maxlength="40" placeholder="Para saber quién la subió"></label>
      <div class="fila">
        <button type="button" id="btnCancelar" class="suave">Cancelar</button>
        <button type="submit" id="btnGuardar" class="principal">Guardar canción</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgVivo">
    <div class="vivo-dlg">
      <h2>Modo en vivo</h2>
      <button id="btnCrearSala" class="principal">Crear sala (soy el director)</button>
      <label>Unirme a una sala
        <input id="codigoSala" maxlength="8" placeholder="Código" autocapitalize="characters" autocomplete="off">
      </label>
      <button id="btnUnir" class="principal">Unirme</button>
      <button id="cerrarVivo" class="suave">Cerrar</button>
    </div>
  </dialog>

  <div id="dir" hidden></div>
  <div id="vivo" hidden>
    <div class="vbar">
      <span id="vinfo"></span>
      <span class="vctl">
        <button class="sw" data-c="#ffffff" style="background:#fff" aria-label="Texto blanco"></button>
        <button class="sw" data-c="#ffd24a" style="background:#ffd24a" aria-label="Texto amarillo"></button>
        <button class="sw" data-c="#6ee7a0" style="background:#6ee7a0" aria-label="Texto verde"></button>
        <button class="sw" data-c="#7fd4ff" style="background:#7fd4ff" aria-label="Texto celeste"></button>
        <button id="vmenos" aria-label="Letra más pequeña">A−</button>
        <button id="vmas" aria-label="Letra más grande">A+</button>
        <button id="vsalir">Salir</button>
      </span>
    </div>
    <div id="vcuerpo" class="vcuerpo"><div class="vin"><div id="vparte"></div><div id="vtexto"></div></div></div>
    <div id="vaviso" role="status"></div>
  </div>

  <div id="aviso" role="status"></div>
  <div id="impresion"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
